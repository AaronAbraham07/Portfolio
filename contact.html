<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Aaron Abraham</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <nav>
      <h1 class="logo">Aaron Abraham</h1>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="portfolio.html">Portfolio/Gallery</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero contact-hero">
    <div class="hero-text">
      <h2>Get in <span>Touch</span></h2>
      <p>I’d love to hear from you; whether it’s a project idea, collaboration, or just a friendly hello!</p>
    </div>
  </section>

  <!-- Contact Form Section -->
  <section class="contact-section">
    <h3 class="section-title">Contact Me</h3>

    <div class="contact-container">
      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <input type="text" id="name" name="name" placeholder="Your Name" required>
        </div>
        <div class="form-group">
          <input type="email" id="email" name="email" placeholder="Your Email" required>
        </div>
        <div class="form-group">
          <textarea id="message" name="message" rows="5" placeholder="Your Message" required></textarea>
        </div>
        <button type="submit" class="btn-submit">Send Message</button>
      </form>

      <div class="contact-info">
        <h4>Connect With Me</h4>
        <p><strong>Email:</strong> aaronabraham091@gmail.com</p>
        <div class="social-icons">
          <a href="https://www.facebook.com/share/1D3EjeDTuo/"><img src="facebook.png" alt="Facebook"></a>
          <a href="https://www.instagram.com/aaron.v.abraham"><img src="instagram.png" alt="Instagram"></a>
          <a href="#"><img src="linkedin.png" alt="LinkedIn"></a>
          <a href="https://github.com/AaronAbraham07"><img src="github.png" alt="GitHub"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 Aaron Abraham | All Rights Reserved</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
